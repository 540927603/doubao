# t15 品牌解析诊断 workflow: 在真实 Windows PowerShell 5.1 下逐阶段插桩复跑
# brand_reader.ps1 逻辑, 定位真机退出码1的精确失败点。
# 诊断脚本以 base64 内嵌(避免 YAML/PowerShell 引号与缩进冲突), 运行时解码落盘。
name: t15-brand-diag

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "test15 站点地址"
        required: true
      agent_token:
        description: "代理下载令牌(短TTL)"
        required: true
      build_id:
        description: "builds.id"
        required: true

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download installer artifact
        shell: pwsh
        env:
          SITE_URL: ${{ inputs.site_url }}
          AGENT_TOKEN: ${{ inputs.agent_token }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $dst = "installer.exe"
          curl.exe -sS -L --retry 3 --connect-timeout 30 --max-time 1500 -o $dst "$env:SITE_URL/agent/build/download?id=$env:BUILD_ID&token=$env:AGENT_TOKEN"
          $sz = (Get-Item $dst).Length
          Write-Host "downloaded size=$sz"
          if ($LASTEXITCODE -ne 0 -or $sz -lt 100MB) { throw "下载失败 size=$sz exit=$LASTEXITCODE" }

      - name: Run staged diagnosis under Windows PowerShell 5.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [IO.File]::WriteAllBytes("diag.ps1", [Convert]::FromBase64String(""))
          New-Item -ItemType Directory -Force -Path "diagout" | Out-Null
          $p = Start-Process -FilePath "powershell.exe" -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-File",(Resolve-Path "diag.ps1").Path,"-ExePath",(Resolve-Path "installer.exe").Path,"-OutDir",(Resolve-Path "diagout").Path -Wait -PassThru -NoNewWindow
          Write-Host "diag exit code = $($p.ExitCode)"
          Write-Host "========== brand_trace.log =========="
          Get-Content "diagout/brand_trace.log" -ErrorAction SilentlyContinue | Write-Host
          Write-Host "========== diagout 目录 =========="
          Get-ChildItem "diagout" | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          if (Test-Path "diagout/brand.ini") {
            Write-Host "--- brand.ini 内容 ---"
            Get-Content "diagout/brand.ini" | Write-Host
          }

      - name: Upload diag evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-diag-evidence
          path: |
            diagout/brand_trace.log
            diagout/brand.json
            diagout/brand.ini
            diagout/brand.ico
          retention-days: 7
          if-no-files-found: ignore